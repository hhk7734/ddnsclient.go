---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "common.names.fullname.namespace" . }}
  labels:
    {{- include "ddnsclient.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "common.names.fullname.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ddnsclient.serviceAccountName" . }}
    namespace: {{ include "common.names.namespace" . }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "common.names.fullname.namespace" . }}-metrics-auth
  labels:
    {{- include "ddnsclient.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "common.names.fullname.namespace" . }}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "ddnsclient.serviceAccountName" . }}
    namespace: {{ include "common.names.namespace" . }}
